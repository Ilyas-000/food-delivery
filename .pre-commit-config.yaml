# Pre-commit hooks configuration
# Install: pre-commit install
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        name: ruff-lint
      # Run the formatter
      - id: ruff-format
        name: ruff-format

  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy-api-gateway
        additional_dependencies:
          - aiokafka
          - pydantic>=2.5.0
          - pydantic-settings>=2.1.0
          - fastapi>=0.109.0
          - httpx>=0.25.2
          - uvicorn>=0.25.0
          - pyjwt
          - redis
          - sqlalchemy[asyncio]>=2.0.23
          - types-passlib
          - types-redis
          - types-requests
        args:
          - --config-file=pyproject.toml
          - --follow-imports=silent
          - --cache-dir=.mypy_cache/pre-commit-api-gateway
        files: ^services/api-gateway/
        exclude: ^(services/api-gateway/tests/|services/api-gateway/migrations/)
      - id: mypy
        name: mypy-user-service
        additional_dependencies:
          - aiokafka
          - pydantic>=2.5.0
          - pydantic-settings>=2.1.0
          - fastapi>=0.109.0
          - httpx>=0.25.2
          - uvicorn>=0.25.0
          - pyjwt
          - redis
          - sqlalchemy[asyncio]>=2.0.23
          - types-passlib
          - types-redis
          - types-requests
        args:
          - --config-file=pyproject.toml
          - --follow-imports=silent
          - --cache-dir=.mypy_cache/pre-commit-user-service
        files: ^services/user-service/
        exclude: ^(services/user-service/tests/|services/user-service/migrations/)
      - id: mypy
        name: mypy-shared
        additional_dependencies:
          - aiokafka
          - pydantic>=2.5.0
          - pydantic-settings>=2.1.0
          - fastapi>=0.109.0
          - httpx>=0.25.2
          - uvicorn>=0.25.0
          - pyjwt
          - redis
          - sqlalchemy[asyncio]>=2.0.23
          - types-passlib
          - types-redis
          - types-requests
        args:
          - --config-file=pyproject.toml
          - --follow-imports=silent
          - --cache-dir=.mypy_cache/pre-commit-shared
        files: ^shared/
        exclude: ^(shared/tests/)

  # Conventional Commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        name: conventional-commits
        stages: [commit-msg]
        args: []

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: trim-trailing-whitespace
      - id: end-of-file-fixer
        name: fix-end-of-file
      - id: check-yaml
        name: check-yaml-syntax
        args: [--unsafe]  # Allow custom YAML tags
      - id: check-json
        name: check-json-syntax
      - id: check-toml
        name: check-toml-syntax
      - id: check-added-large-files
        name: check-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: check-merge-conflicts
      - id: check-case-conflict
        name: check-case-conflicts
      - id: detect-private-key
        name: detect-private-keys
      - id: mixed-line-ending
        name: fix-mixed-line-endings
        args: [--fix=lf]

  # Python-specific checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast
        name: check-python-ast
      - id: debug-statements
        name: check-debug-statements
      - id: check-docstring-first
        name: check-docstring-first

  # Security checks - bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        name: bandit-security
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Docker-specific checks
  - repo: local
    hooks:
      - id: hadolint-dockerfile
        name: hadolint-dockerfile
        language: system
        files: (^|/)(Dockerfile|.*\.dockerfile)$
        entry: >
          bash -lc '
          if command -v hadolint >/dev/null 2>&1; then
            hadolint --ignore DL3008 --ignore DL3013 "$@";
          else
            echo "hadolint is not installed; skipping Dockerfile lint";
          fi
          ' --

# Configuration for specific hooks
default_language_version:
  python: python3.12

# Performance optimization
default_stages: [pre-commit]

# Fail fast - stop on first error
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: "3.0.0"
