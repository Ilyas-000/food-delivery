version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: food-delivery-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: food-delivery-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: food-delivery-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: food-delivery-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: food-delivery-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ==========================================
  # Microservices
  # ==========================================

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: food-delivery-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      # Service Configuration
      USER_SERVICE_SERVICE_NAME: user-service
      USER_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      USER_SERVICE_DEBUG: ${DEBUG:-true}
      USER_SERVICE_LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      USER_SERVICE_API_HOST: 0.0.0.0
      USER_SERVICE_API_PORT: 8001

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      USER_SERVICE_DB_NAME: ${USER_SERVICE_DB_NAME:-user_service_db}
      USER_SERVICE_DB_USER: ${USER_SERVICE_DB_USER:-user_service_user}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-user_service_password_change_me}
      USER_SERVICE_DATABASE_POOL_SIZE: 10
      USER_SERVICE_DATABASE_MAX_OVERFLOW: 20
      USER_SERVICE_DATABASE_ECHO: false

      # JWT Configuration
      USER_SERVICE_JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      USER_SERVICE_JWT_ALGORITHM: HS256
      USER_SERVICE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30
      USER_SERVICE_JWT_REFRESH_TOKEN_EXPIRE_DAYS: 7

      # Security
      USER_SERVICE_PASSWORD_BCRYPT_ROUNDS: 12

      # Redis Configuration
      USER_SERVICE_REDIS_HOST: redis
      USER_SERVICE_REDIS_PORT: 6379
      USER_SERVICE_REDIS_DB: 0

      # CORS (для development разрешаем все)
      USER_SERVICE_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
    volumes:
      - ../services/user-service/src:/app/src:ro  # Mount для hot-reload в development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
