services:
  postgres:
    image: postgres:15-alpine
    container_name: food-delivery-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: food-delivery-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: food-delivery-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep 'Zookeeper version'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: food-delivery-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: food-delivery-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: food-delivery-pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ==========================================
  # Microservices
  # ==========================================

  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    container_name: food-delivery-user-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      # Service Configuration
      USER_SERVICE_SERVICE_NAME: user-service
      USER_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      USER_SERVICE_DEBUG: ${DEBUG:-true}
      USER_SERVICE_LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      USER_SERVICE_API_HOST: 0.0.0.0
      USER_SERVICE_API_PORT: 8001

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      USER_SERVICE_DB_NAME: ${USER_SERVICE_DB_NAME:-user_service_db}
      USER_SERVICE_DB_USER: ${USER_SERVICE_DB_USER:-user_service_user}
      USER_SERVICE_DB_PASSWORD: ${USER_SERVICE_DB_PASSWORD:-user_service_password_change_me}
      USER_SERVICE_DATABASE_POOL_SIZE: 10
      USER_SERVICE_DATABASE_MAX_OVERFLOW: 20
      USER_SERVICE_DATABASE_ECHO: false

      # JWT Configuration
      USER_SERVICE_JWT_SECRET_KEY: ${USER_SERVICE_JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      USER_SERVICE_JWT_ALGORITHM: ${USER_SERVICE_JWT_ALGORITHM:-HS256}
      USER_SERVICE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${USER_SERVICE_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      USER_SERVICE_JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${USER_SERVICE_JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Security
      USER_SERVICE_PASSWORD_BCRYPT_ROUNDS: ${USER_SERVICE_BCRYPT_ROUNDS_DOCKER:-4}

      # Redis Configuration
      USER_SERVICE_REDIS_HOST: redis
      USER_SERVICE_REDIS_PORT: 6379
      USER_SERVICE_REDIS_DB: 0

      # CORS (для development разрешаем все)
      USER_SERVICE_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
    volumes:
      - ../services/user-service/src:/app/src:ro  # Mount для hot-reload в development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 40s

  restaurant-service:
    build:
      context: ..
      dockerfile: services/restaurant-service/Dockerfile
    container_name: food-delivery-restaurant-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      # Service Configuration
      RESTAURANT_SERVICE_SERVICE_NAME: restaurant-service
      RESTAURANT_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      RESTAURANT_SERVICE_DEBUG: ${DEBUG:-true}
      RESTAURANT_SERVICE_LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # API Configuration
      RESTAURANT_SERVICE_API_HOST: 0.0.0.0
      RESTAURANT_SERVICE_API_PORT: 8002
      RESTAURANT_SERVICE_API_PREFIX: /api/v1

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      RESTAURANT_SERVICE_DB_NAME: ${RESTAURANT_SERVICE_DB_NAME:-restaurant_service_db}
      RESTAURANT_SERVICE_DB_USER: ${RESTAURANT_SERVICE_DB_USER:-restaurant_service_user}
      RESTAURANT_SERVICE_DB_PASSWORD: ${RESTAURANT_SERVICE_DB_PASSWORD:-restaurant_service_password_change_me}
      RESTAURANT_SERVICE_DATABASE_POOL_SIZE: 10
      RESTAURANT_SERVICE_DATABASE_MAX_OVERFLOW: 20
      RESTAURANT_SERVICE_DATABASE_ECHO: false

      # Redis Configuration
      RESTAURANT_SERVICE_REDIS_HOST: redis
      RESTAURANT_SERVICE_REDIS_PORT: 6379
      RESTAURANT_SERVICE_REDIS_DB: 2

      # CORS
      RESTAURANT_SERVICE_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
    volumes:
      - ../services/restaurant-service/src:/app/services/restaurant-service/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  order-service:
    build:
      context: ..
      dockerfile: services/order-service/Dockerfile
    container_name: food-delivery-order-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      ORDER_SERVICE_SERVICE_NAME: order-service
      ORDER_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      ORDER_SERVICE_DEBUG: ${DEBUG:-true}
      ORDER_SERVICE_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ORDER_SERVICE_REPOSITORY_BACKEND: postgres
      ORDER_SERVICE_SAGA_BACKEND: ${ORDER_SERVICE_SAGA_BACKEND:-http}
      ORDER_SERVICE_SAGA_STEP_TIMEOUT_SECONDS: ${ORDER_SERVICE_SAGA_STEP_TIMEOUT_SECONDS:-5}

      ORDER_SERVICE_API_HOST: 0.0.0.0
      ORDER_SERVICE_API_PORT: 8003
      ORDER_SERVICE_API_PREFIX: /api/v1

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ORDER_SERVICE_DB_NAME: ${ORDER_SERVICE_DB_NAME:-order_service_db}
      ORDER_SERVICE_DB_USER: ${ORDER_SERVICE_DB_USER:-order_service_user}
      ORDER_SERVICE_DB_PASSWORD: ${ORDER_SERVICE_DB_PASSWORD:-order_service_password_change_me}
      ORDER_SERVICE_DATABASE_POOL_SIZE: 10
      ORDER_SERVICE_DATABASE_MAX_OVERFLOW: 20
      ORDER_SERVICE_DATABASE_ECHO: false
      ORDER_SERVICE_RESTAURANT_SERVICE_URL: ${ORDER_SERVICE_RESTAURANT_SERVICE_URL:-http://restaurant-service:8002}
      ORDER_SERVICE_PAYMENT_SERVICE_URL: ${ORDER_SERVICE_PAYMENT_SERVICE_URL:-http://payment-service:8004}
      ORDER_SERVICE_DELIVERY_SERVICE_URL: ${ORDER_SERVICE_DELIVERY_SERVICE_URL:-http://delivery-service:8005}
    volumes:
      - ../services/order-service/src:/app/services/order-service/src:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/Dockerfile
    container_name: food-delivery-payment-service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      PAYMENT_SERVICE_SERVICE_NAME: payment-service
      PAYMENT_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      PAYMENT_SERVICE_DEBUG: ${DEBUG:-true}
      PAYMENT_SERVICE_API_HOST: 0.0.0.0
      PAYMENT_SERVICE_API_PORT: 8004
      PAYMENT_SERVICE_API_PREFIX: /api/v1
    volumes:
      - ../services/payment-service/src:/app/services/payment-service/src:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  delivery-service:
    build:
      context: ..
      dockerfile: services/delivery-service/Dockerfile
    container_name: food-delivery-delivery-service
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      DELIVERY_SERVICE_SERVICE_NAME: delivery-service
      DELIVERY_SERVICE_ENVIRONMENT: ${ENVIRONMENT:-development}
      DELIVERY_SERVICE_DEBUG: ${DEBUG:-true}
      DELIVERY_SERVICE_API_HOST: 0.0.0.0
      DELIVERY_SERVICE_API_PORT: 8005
      DELIVERY_SERVICE_API_PREFIX: /api/v1
    volumes:
      - ../services/delivery-service/src:/app/services/delivery-service/src:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=5).read()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: food-delivery-api-gateway
    restart: unless-stopped
    depends_on:
      - redis
      - user-service
      - restaurant-service
      - order-service
      - payment-service
    ports:
      - "8000:8000"
    environment:
      # Server
      GATEWAY_HOST: ${GATEWAY_HOST:-0.0.0.0}
      GATEWAY_PORT: ${GATEWAY_PORT:-8000}
      GATEWAY_ENVIRONMENT: ${ENVIRONMENT:-development}
      GATEWAY_DEBUG: ${DEBUG:-true}

      # CORS
      GATEWAY_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'

      # JWT (must match User Service)
      GATEWAY_JWT_SECRET_KEY: ${GATEWAY_JWT_SECRET_KEY:-your-super-secret-key-change-in-production}
      GATEWAY_JWT_ALGORITHM: ${GATEWAY_JWT_ALGORITHM:-HS256}

      # Redis (for rate limiting)
      GATEWAY_REDIS_HOST: ${GATEWAY_REDIS_HOST:-redis}
      GATEWAY_REDIS_PORT: ${GATEWAY_REDIS_PORT:-6379}
      GATEWAY_REDIS_DB: ${GATEWAY_REDIS_DB:-1}

      # Service URLs
      GATEWAY_USER_SERVICE_URL: ${GATEWAY_USER_SERVICE_URL:-http://user-service:8001}
      GATEWAY_RESTAURANT_SERVICE_URL: ${GATEWAY_RESTAURANT_SERVICE_URL:-http://restaurant-service:8002}
      GATEWAY_ORDER_SERVICE_URL: ${GATEWAY_ORDER_SERVICE_URL:-http://order-service:8003}
      GATEWAY_PAYMENT_SERVICE_URL: ${GATEWAY_PAYMENT_SERVICE_URL:-http://payment-service:8004}

      # Circuit Breaker
      GATEWAY_CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      GATEWAY_CIRCUIT_BREAKER_RECOVERY_TIMEOUT: 30.0

      # Rate Limiting
      GATEWAY_RATE_LIMIT_ENABLED: true
      GATEWAY_LOGIN_PER_IP_MINUTE: 10
      GATEWAY_LOGIN_PER_IP_HOUR: 100
      GATEWAY_LOGIN_PER_ACCOUNT_MINUTE: 5
      GATEWAY_LOGIN_PER_ACCOUNT_HOUR: 20
      GATEWAY_LOGIN_PER_IP_ACCOUNT_MINUTE: 3
      GATEWAY_LOGIN_MAX_FAILS_COUNT: 5
      GATEWAY_LOGIN_MAX_FAILS_WINDOW: 600
      GATEWAY_LOGIN_COOLDOWN_DURATION: 900
      GATEWAY_REFRESH_PER_JTI_MINUTE: 10
      GATEWAY_REFRESH_PER_JTI_HOUR: 60
      GATEWAY_REFRESH_PER_USER_MINUTE: 30
      GATEWAY_REFRESH_PER_USER_HOUR: 300
      GATEWAY_REFRESH_PER_IP_MINUTE: 60
      GATEWAY_REFRESH_PER_IP_HOUR: 1000
      GATEWAY_REFRESH_INVALID_PER_IP_MINUTE: 5
      GATEWAY_REFRESH_INVALID_PER_IP_HOUR: 20
      GATEWAY_AUTH_GLOBAL_PER_IP_MINUTE: 60
      GATEWAY_AUTH_GLOBAL_BURST: 20
      GATEWAY_AUTH_GLOBAL_PER_IP_HOUR: 1000

      # Logging
      GATEWAY_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GATEWAY_LOG_JSON: true
    volumes:
      - ../services/api-gateway/src:/app/src:ro  # Mount для hot-reload в development
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx; httpx.get('http://localhost:8000/health', timeout=5.0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  test-runner:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: infrastructure/docker/test-runner.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
    working_dir: /workspace
    environment:
      USER_SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://${USER_SERVICE_DB_USER:-user_service_user}:${USER_SERVICE_DB_PASSWORD:-user_service_password_change_me}@postgres:5432/${USER_SERVICE_TEST_DB_NAME:-user_service_test_db}
      RESTAURANT_SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://${RESTAURANT_SERVICE_DB_USER:-restaurant_service_user}:${RESTAURANT_SERVICE_DB_PASSWORD:-restaurant_service_password_change_me}@postgres:5432/${RESTAURANT_SERVICE_TEST_DB_NAME:-restaurant_service_test_db}
      ORDER_SERVICE_TEST_DATABASE_URL: postgresql+asyncpg://${ORDER_SERVICE_DB_USER:-order_service_user}:${ORDER_SERVICE_DB_PASSWORD:-order_service_password_change_me}@postgres:5432/${ORDER_SERVICE_TEST_DB_NAME:-order_service_test_db}
      GATEWAY_USER_SERVICE_URL: http://user-service:8001
      GATEWAY_ORDER_SERVICE_URL: http://order-service:8003
      GATEWAY_PAYMENT_SERVICE_URL: http://payment-service:8004
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: 6379
      GATEWAY_REDIS_DB: 15
    volumes:
      - ..:/workspace

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:
