global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:8001"]

  - job_name: restaurant-service
    metrics_path: /metrics
    static_configs:
      - targets: ["restaurant-service:8002"]

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:8003"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-service:8004"]

  - job_name: delivery-service
    metrics_path: /metrics
    static_configs:
      - targets: ["delivery-service:8005"]

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ["notification-service:8006"]

  - job_name: analytics-service
    metrics_path: /metrics
    static_configs:
      - targets: ["analytics-service:8007"]

  - job_name: review-service
    metrics_path: /metrics
    static_configs:
      - targets: ["review-service:8008"]
