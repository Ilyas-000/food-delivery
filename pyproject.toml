[project]
name = "food-delivery"
version = "0.1.0"
description = "Microservices food delivery platform for learning enterprise patterns"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Food Delivery Team" }
]
license = { text = "MIT" }

# Root project has no dependencies - each service manages its own
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.1.9",
    "mypy>=1.8.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.25.2",  # For testing HTTP clients
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Root project is a workspace aggregator, not a package.
[tool.hatch.build.targets.wheel]
only-include = ["README.md", "pyproject.toml"]

# uv workspace configuration
[tool.uv.workspace]
members = [
    "services/*",
    "shared",
]

# Ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments to function call
    "TRY003",   # Avoid specifying long messages outside exception class
    "EM101",    # Exception must not use string literal
    "EM102",    # Exception must not use f-string literal
    "RUF002",   # Docstring contains ambiguous unicode (allow Cyrillic in educational project)
    "RUF003",   # Comment contains ambiguous unicode (allow Cyrillic in educational project)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = [
    "PLR2004",  # Magic value used in comparison
    "S101",     # Use of assert detected
    "ARG001",   # Unused function argument (fixtures)
]
"*/domain/**/*.py" = [
    "PLR2004",  # Magic value used in comparison (business rules)
]

[tool.ruff.lint.isort]
known-first-party = ["shared"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# MyPy configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = false
show_error_codes = true
mypy_path = ["shared/src"]
exclude = "(^services/.*/tests/|^tests/)"

[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
    "confluent_kafka.*",
    "alembic",
    "alembic.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "bcrypt",
    "email_validator",
    "structlog",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pytest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*.tests.*",
]
ignore_missing_imports = true
disallow_untyped_decorators = false

# Relaxed rules for skeleton/config files (will be fixed in production branches)
[[tool.mypy.overrides]]
module = [
    "src.main",
    "src.config",
    "services.*.src.main",
    "services.*.src.config",
]
disallow_untyped_defs = false
disallow_untyped_decorators = false

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests with external dependencies",
    "e2e: End-to-end tests",
    "slow: Tests that take a long time to run",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
data_file = "/tmp/coverage-food-delivery"
source = ["services", "shared"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.bandit]
exclude_dirs = [
    "services/*/tests",
    "tests",
]
