[project]
name = "food-delivery-user-service"
version = "0.1.0"
description = "User Service - Authentication and user profile management"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Food Delivery Team" }
]

dependencies = [
    # Internal dependencies
    "food-delivery-shared",

    # FastAPI
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.25.0",

    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.23",
    "alembic>=1.13.0",

    # Security
    "pyjwt[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",

    # Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.1.0",

    # Utilities
    "python-dateutil>=2.8.2",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "httpx>=0.25.2",  # For TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package configuration
[tool.hatch.build.targets.wheel]
packages = ["src"]

# Ruff inherits from root
[tool.ruff]
extend = "../../pyproject.toml"

# uv workspace sources
[tool.uv.sources]
food-delivery-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-q",
    "--disable-warnings",
    "--cov=src",
    "--cov-report=",
]
