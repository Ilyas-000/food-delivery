[project]
name = "food-delivery-shared"
version = "0.1.0"
description = "Shared code for Food Delivery microservices"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Food Delivery Team" }
]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async HTTP & File I/O
    "httpx>=0.25.2",
    "aiofiles>=23.2.1",

    # Kafka (event bus)
    "aiokafka>=0.10.0",

    # Redis (cache, session, pub/sub)
    "redis[hiredis]>=5.0.1",

    # JWT utilities (shared across services)
    "pyjwt[crypto]>=2.8.0",

    # Utilities
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Package configuration
[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

# Ruff inherits from root pyproject.toml
[tool.ruff]
extend = "../pyproject.toml"

# MyPy configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Allow missing imports for third-party libraries
[[tool.mypy.overrides]]
module = [
    "aiokafka.*",
]
ignore_missing_imports = true
